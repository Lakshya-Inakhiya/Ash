name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  # Publishes the web app to Hugging Face Spaces after tests pass on main.
  # Needs the HF_TOKEN secret and HF_SPACE variable (e.g. "your-name/ash") set in the repo settings.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install huggingface_hub
      - run: >-
          hf upload "$HF_SPACE" . . --repo-type space
          --include "app.py" --include "requirements.txt" --include "ash/*.py" --include "config/*.yaml"
      - run: hf upload "$HF_SPACE" space/README.md README.md --repo-type space
