# Ash's brain settings, shared by the web app and the Raspberry Pi robot.

llm:
  # Groq's free API (console.groq.com). Any OpenAI-compatible provider works here.
  base_url: https://api.groq.com/openai/v1
  # Tried in order: if one is busy, rate-limited or retired, Ash uses the next.
  models: [openai/gpt-oss-20b, llama-3.1-8b-instant, openai/gpt-oss-120b]
  speech_models: [whisper-large-v3-turbo, whisper-large-v3]
  system_instruction: >-
    You are Ash, a small, friendly desktop robot. Answer in 1-2 short sentences.
    Your replies are spoken aloud, so don't use markdown, lists or emoji.

voice: en-US-AnaNeural  # any voice from `edge-tts --list-voices`

# Gesture poses in servo degrees: 135 is arm down, 45 is arm up.
gestures:
  neutral: 90
  arms_up: 45
  arms_down: 135
  wave_start: 60
  wave_end: 120
  point_up: 45
