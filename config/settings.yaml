# Ash's brain settings, shared by the web app and the Raspberry Pi robot.

llm:
  # "gemini-flash-latest" always points at Google's current Flash model (free tier works).
  # If a model set here gets retired, Ash switches to another Flash model by itself.
  model: gemini-flash-latest
  # Tried in order when the main model is overloaded or out of free quota.
  backup_models: [gemini-flash-lite-latest, gemini-2.5-flash]
  system_instruction: >-
    You are Ash, a small, friendly desktop robot. Answer in 1-2 short sentences.
    Your replies are spoken aloud, so don't use markdown, lists or emoji.

voice: en-US-AnaNeural  # any voice from `edge-tts --list-voices`

# Gesture poses in servo degrees: 135 is arm down, 45 is arm up.
gestures:
  neutral: 90
  arms_up: 45
  arms_down: 135
  wave_start: 60
  wave_end: 120
  point_up: 45
